<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sorteo Killer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
#winnerZoom{
    position:fixed;
    z-index:99999;
    left:50%;
    top:145px;
    width:460px;
    height:570px;
    transform:translateX(-50%);
    object-fit:cover;

    border-radius:16px;
    border:4px solid #111;

    box-shadow:
    0 0 0 2px #e6e6e6,
    0 0 0 3px #111,
    0 0 22px rgba(88,244,255,.55),
    0 0 42px rgba(178,20,20,.4),
    0 30px 40px -12px rgba(0,0,0,.85);

    opacity:0;
    pointer-events:none;
    cursor:pointer;
}
#winnerZoom .esquina{
    position:absolute;
    width:28px;
    height:28px;
    pointer-events:none;
    z-index:1001;
    opacity:0;
    transition:opacity .3s ease .4s;
}
#winnerZoom.zoom-activo .esquina{
    opacity:1;
}
#winnerZoom .esquina-tl{ top:-4px; left:-4px; border-top:3px solid #e8c15a; border-left:3px solid #e8c15a; border-radius:8px 0 0 0; }
#winnerZoom .esquina-tr{ top:-4px; right:-4px; border-top:3px solid #e8c15a; border-right:3px solid #e8c15a; border-radius:0 8px 0 0; }
#winnerZoom .esquina-bl{ bottom:-4px; left:-4px; border-bottom:3px solid #e8c15a; border-left:3px solid #e8c15a; border-radius:0 0 0 8px; }
#winnerZoom .esquina-br{ bottom:-4px; right:-4px; border-bottom:3px solid #e8c15a; border-right:3px solid #e8c15a; border-radius:0 0 8px 0; }
#winnerName{
    position:fixed;
    left:50%;
    top:80px;
    display:flex;
    align-items:center;
    gap:0.28em;

    transform:translateX(-50%);

    white-space:nowrap;
    max-width:90vw;

    opacity:0;

    z-index:100000;
    transition:
    left 0.9s ease-out,
    top 0.9s ease-out,
    font-size 0.9s ease-out,
    opacity 0.3s ease;

  pointer-events:none;
cursor:pointer;
}
#winnerName .deco-line{
    position:relative;
    width:0.9em;
    height:3px;
    flex:0 0 auto;
    border-radius:2px;
    box-shadow:0 0 5px rgba(179,0,0,.7);
}
#winnerName .deco-line.izq{
    background:linear-gradient(90deg, transparent, #b30000 75%, #ff5555 100%);
}
#winnerName .deco-line.der{
    background:linear-gradient(90deg, #ff5555 0%, #b30000 25%, transparent);
}
#winnerName .deco-line::after{
    content:"";
    position:absolute;
    top:50%;
    width:7px;
    height:7px;
    background:#ff4d4d;
    border-radius:2px;
    transform:translateY(-50%) rotate(45deg);
    box-shadow:0 0 8px rgba(255,60,60,.9);
}
#winnerName .deco-line.izq::after{ right:-3px; }
#winnerName .deco-line.der::after{ left:-3px; }
#winnerNameText{
    font-family:'Anton', Arial, Helvetica, sans-serif;
    font-size:1em;
    font-weight:400;
    letter-spacing:1px;

    text-transform:uppercase;

    color:#ffffff;

    -webkit-text-stroke: 4px black;

    text-shadow:
    -3px -3px 0 #000,
     3px -3px 0 #000,
    -3px  3px 0 #000,
     3px  3px 0 #000,

    -3px 0 0 #000,
     3px 0 0 #000,
     0 -3px 0 #000,
     0  3px 0 #000,

     0 0 30px rgba(179,0,0,.55),
     0 6px 12px rgba(0,0,0,.8);
    display:inline-block;
}
#winnerNameText.name-pop{
    animation: namePop .55s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes namePop{
    0%{ transform:scale(1.35); opacity:0; }
    55%{ opacity:1; }
    100%{ transform:scale(1); opacity:1; }
}

#winnerZoom.zoom-activo{
    overflow:hidden;
}
#winnerZoom.zoom-activo::after{
    content:"";
    position:absolute;
    top:-40%;
    left:-120%;
    width:90%;
    height:220%;

    background:linear-gradient(
        90deg,
        rgba(255,255,255,0) 0%,
        rgba(255,255,255,0.35) 35%,
        rgba(255,255,255,1) 50%,
        rgba(255,255,255,0.35) 65%,
        rgba(255,255,255,0) 100%
    );

    transform:rotate(25deg);

    /* pasada única y más lenta: no molesta en directos largos */
    animation:marcoReflect 1.3s ease-out 1 both;
    animation-delay:.15s;

    pointer-events:none;
    z-index:1000;
}
#winnerZoom.zoom-activo::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:inherit;
    box-shadow:
        inset 0 0 25px rgba(0,0,0,.55),
        inset 0 -40px 40px rgba(0,0,0,.35);
    pointer-events:none;
    z-index:999;
}
body{
    margin:0;
    background:transparent;
    font-family:Arial,Helvetica,sans-serif;
    text-align:center;
    padding:60px 10px 30px 10px;
    color:#fff;
}
#galeria{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    max-width:1600px;
    margin:auto;
    padding:10px;
}
#galeria::before{
    content:"";
    position:absolute;
    inset:-30px -10px;
    pointer-events:none;
    background:none;
    z-index:5;
}
.fila{
    display:flex;
    justify-content:center;
    gap:6px;
    width:100%;
    flex-wrap:nowrap;
}
.foto{
    width:95px;
    height:95px;
    position:relative;

    border:3px solid #000;

    border-radius:18px;

    box-shadow:
    0 0 0 1px #000,
    inset 0 0 10px rgba(0,0,0,.55);
    overflow:visible;
    background:#222;
    cursor:pointer;
    transition:.15s;
    display:flex;
    align-items:center;
    justify-content:center;
    box-sizing:border-box;
}
.foto img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    border-radius:18px;
}
.marco-killer{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:fill;
    pointer-events:none;
    opacity:0;
    z-index:999;
}

.activa .marco-killer{
    opacity:1;
}
.ganador .marco-killer{
    opacity:1;
}

.foto:hover{
    transform:scale(1.03);
}
.activa{
    border:3px solid #e8f3ff !important;
    border-radius:12px;

    background:linear-gradient(
        135deg,
        #ffffff 0%,
        #dbe5ec 15%,
        #a8b5c1 30%,
        #ffffff 50%,
        #9fadb8 70%,
        #dbe5ec 85%,
        #ffffff 100%
    );

    box-shadow:
    0 0 8px rgba(255,255,255,.8),
    0 0 18px rgba(88,244,255,.8),
    0 0 35px rgba(88,244,255,.55),
    0 0 55px rgba(179,0,0,.35),
    inset 0 0 10px rgba(0,0,0,.4);

    transform:scale(1.10);
    z-index:20;
    position:relative;
    overflow:hidden;
}

.activa::before{
    content:"";
    position:absolute;
    inset:-10px;
    border-radius:18px;
    box-shadow:
    0 0 20px #4ef7ff,
    0 0 40px rgba(78,247,255,.8),
    0 0 70px rgba(78,247,255,.45);


    pointer-events:none;
}

.activa::after{
    content:"";
    position:absolute;
    top:-40%;
    left:-120%;
    width:90%;
    height:220%;
    background:linear-gradient(
        90deg,
        rgba(255,255,255,0) 0%,
        rgba(255,255,255,0.35) 35%,
        rgba(255,255,255,1) 50%,
        rgba(255,255,255,0.35) 65%,
        rgba(255,255,255,0) 100%
    );
    transform:rotate(25deg);
    animation:marcoReflect .25s linear infinite;
    pointer-events:none;
    z-index:1000;
}



   

@keyframes marcoReflect{
    from{
        left:-120%;
    }
    to{
        left:180%;
    }
}
.ganador{
    transform:scale(1.18);
    z-index:50;
    position:relative;

    border:3px solid #e8f3ff !important;
    border-radius:18px;

    overflow:hidden;

    box-shadow:
    0 0 8px rgba(255,255,255,.8),
    0 0 18px rgba(88,244,255,.8),
    0 0 35px rgba(88,244,255,.55),
    0 0 60px rgba(179,0,0,.4),
    0 25px 30px -10px rgba(0,0,0,.75);
}
.ganador::before{
    display:none;
}
.ganador::after{
    display:none;
}

@keyframes marcoGanador{
    from{
        left:-120%;
    }
    to{
        left:180%;
    }
}
.desactivado{
    opacity:.25;
    filter:grayscale(100%);
    border-color:#ff4444 !important;
}
.desactivado::after{
    content:"❌";
    position:absolute;
    top:0;
    left:0;
    right:0;
    background:red;
    color:white;
    font-size:12px;
    font-weight:bold;
    text-align:center;
}
.falta-badge{
    position:absolute;
    bottom:4px;
    left:4px;
    right:4px;
    font-size:10px;
    color:#ffdddd;
    background:rgba(0,0,0,0.6);
    padding:2px;
    border-radius:4px;
    pointer-events:none;
    text-align:center;
}
#panelFinal{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    min-height:0;
    margin-top:0;
}
#resultado{
    font-size:28px;
    font-weight:bold;
    color:#000;
    background:linear-gradient(white,white);
    padding:8px 14px;
    border-radius:8px;
    margin-bottom:14px;
}

/* ===== BOTÓN "GIRAR" — diamante terrorífico, se puede arrastrar libremente ===== */
#diceWrap{
    position:fixed;
    top:170px;
    right:560px;
    width:108px;
    height:108px;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:500;
    cursor:grab;
    touch-action:none;
}
#diceWrap.arrastrando{ cursor:grabbing; }
#progressRing{ display:none; }

#botonSorteo{
    position:relative;
    width:100px;
    height:100px;
    border:none;
    background:transparent;
    padding:0;
    margin:0;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform .15s;
}
#botonSorteo:hover{ transform:scale(1.06); }
#botonSorteo:active{ transform:scale(.95); }

#botonSorteo .diamante{
    position:absolute;
    inset:14px;
    transform:rotate(45deg);
    border-radius:16px;
    background:linear-gradient(135deg,#2b0000 0%,#8b0000 45%,#c40000 60%,#2b0000 100%);
    border:3px solid #000;
    box-shadow:
        0 0 12px rgba(255,20,20,.9),
        0 0 26px rgba(255,0,0,.55),
        0 0 46px rgba(139,0,0,.45),
        inset 0 0 14px rgba(0,0,0,.65);
    transition:background .4s ease, box-shadow .4s ease;
}

#botonSorteo .texto-girar{
    position:relative;
    z-index:2;
    font-family:'Anton', Arial, Helvetica, sans-serif;
    font-size:19px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:#000;
    -webkit-text-stroke:1px #fff;
    text-shadow:
        -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff,
        0 0 3px #fff;
    pointer-events:none;
    user-select:none;
}

/* Estado GIRANDO: se pone verde y gira con parpadeo tétrico */
#botonSorteo.girando .diamante{
    background:linear-gradient(135deg,#01230a 0%,#0d6b1c 45%,#28e04a 60%,#01230a 100%);
    box-shadow:
        0 0 14px rgba(30,255,80,.9),
        0 0 30px rgba(20,200,60,.6),
        0 0 55px rgba(10,110,25,.5),
        inset 0 0 14px rgba(0,0,0,.65);
    animation:girarTerror .9s linear infinite, flickerTerror .17s steps(2) infinite;
}
@keyframes girarTerror{
    from{ transform:rotate(45deg); }
    to{ transform:rotate(405deg); }
}
@keyframes flickerTerror{
    0%,100%{ filter:brightness(1) saturate(1); }
    50%{ filter:brightness(1.4) saturate(1.5); }
}
</style>
</head>
<body>

<div id="galeria">
    <div id="panelFinal">
        <div id="resultado"></div>
        <div id="diceWrap">
            <svg id="progressRing" width="100" height="100" viewBox="0 0 100 100">
                <defs>
                    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#58f4ff"/>
                        <stop offset="100%" stop-color="#b30000"/>
                    </linearGradient>
                </defs>
                <circle class="ring-bg" cx="50" cy="50" r="44"></circle>
                <circle class="ring-fg" cx="50" cy="50" r="44"></circle>
            </svg>
            <button id="botonSorteo" aria-label="Girar">
                <span class="diamante"></span>
                <span class="texto-girar" id="textoGirar">GIRAR</span>
            </button>
        </div>
    </div>
</div>

<script>
// PARTICIPANTES
// Si prefieres puedes dar la url exacta de una imagen añadiendo la propiedad "url" al objeto,
// por ejemplo: { nombre: "LA ONRYÓ", url: "./images/LA_ONRYO.png", activo: true }
// Si no pones url, el script probará variantes automáticamente.
let participantes = [
    "ADIESTRADORA",
    "ANIMATRÓNICO",
    "ARPONERO",
    "ARTISTA",
    "BRUJA",
    "CABALLERO",
    "CANIBAL",
    "CAZADORA",
    "CENOBICHE",
    "CERDA",
    "CEREBRO",
    "COMERCIANTE",
    "DEMOGORGON",
    "DESCONOCIDO",
    "DETERIORO",
    "DOCTOR",
    "DRAGA",
    "ENFERMERA",
    "ESPECTRO",
    "ESPÍRITU",
    "FORMA",
    "GHOST FACE",
    "GHOUL",
    "GOOD GUY",
    "JUICIO",
    "KRASUE",
    "LEGIÓN",
    "LICHE",
    "MELLIZOS",
    "NÉMESIS",
    "ONI",
    "ONRYÓ",
    "PAYASO",
    "PESADILLA",
    "PLAGA",
    "PRIMERO",
    "PUEBLERINO",
    "RAJADOR",
    "SENOMORFO",
    "SEÑOR OSCURO",
    "SINGULARIDAD",
    "TRAICIONERO",
    "TRAMPERO",
    "VERDUGO"
].map(nombre => ({ nombre, activo: true }));

const galeria = document.getElementById("galeria");
const panelFinal = document.getElementById("panelFinal");
const boton = document.getElementById("botonSorteo");
const resultadoEl = document.getElementById("resultado");
const progressRing = document.getElementById("progressRing");
const ringFg = progressRing.querySelector(".ring-fg");
const RING_C = 276.46;

const textoGirarEl = document.getElementById("textoGirar");
function setIconoBoton(estado){
    textoGirarEl.textContent = estado === "stop" ? "PARAR" : "GIRAR";
}

/* AUDIO (igual que antes) */
let audioCtx;
function iniciarAudio(){ if(!audioCtx){ audioCtx = new(window.AudioContext || window.webkitAudioContext)(); } }
function sonidoTick(){
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = "square"; osc.frequency.value = 700;
    gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.05);
}
function sonidoGanador(){
    if(!audioCtx) return;
    const notas = [523,659,784,1046,1318];
    notas.forEach((freq,i)=>{
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = "triangle"; osc.frequency.value = freq;
        osc.connect(gain); gain.connect(audioCtx.destination);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime + i*0.15);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i*0.15 + 0.25);
        osc.start(audioCtx.currentTime + i*0.15); osc.stop(audioCtx.currentTime + i*0.15 + 0.25);
    });
}

/* UTIL: fallback SVG */
function fallbackDataURL(size = 110){
    const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='${size}' height='${size}'><rect width='100%' height='100%' fill='#333'/><text x='50%' y='50%' fill='#fff' font-size='12' font-family='Arial' dominant-baseline='middle' text-anchor='middle'>Sin imagen</text></svg>`;
    return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
}

/* Normaliza quitando diacríticos y haciendo slug */
function slugify(name){
    // separa diacríticos y los quita, luego convierte a guion_bajo
    const without = name.normalize('NFD').replace(/\p{M}/gu, '');
    return without.replace(/[^a-zA-Z0-9]+/g, '_').replace(/^_|_$/g, '');
}

/* Prueba variantes; si killer.url existe la prueba primero, si no, genera candidatos */
function tryImageCandidatesVerbose(killer){
    // si el objeto participante trae url explícita, probarla primero
    if(killer.url){
        return new Promise(resolve => {
            const tester = new Image();
            tester.onload = () => { console.log(`-> url explícita encontrada para "${killer.nombre}": ${killer.url}`); resolve(killer.url); };
            tester.onerror = () => { console.warn(`url explícita NO válida para "${killer.nombre}": ${killer.url}`); resolve(null); };
            tester.src = killer.url;
        });
    }

    const name = killer.nombre;
    const prefixes = ['./Ruleta Killer/', './images/', './'];
    const extensions = ['webp','png','jpg','jpeg','gif','svg'];
    const raw = name;
    const encoded = encodeURIComponent(name);
    const unders = raw.replace(/\s+/g, '_');
    const dash = raw.replace(/\s+/g, '-');
    const slug = slugify(name); // sin diacríticos
    const lower = raw.toLowerCase();

    const candidates = [];
    prefixes.forEach(pref => {
        extensions.forEach(ext => {
            candidates.push(`${pref}${encoded}.${ext}`);
            candidates.push(`${pref}${raw}.${ext}`);
            candidates.push(`${pref}${unders}.${ext}`);
            candidates.push(`${pref}${dash}.${ext}`);
            candidates.push(`${pref}${slug}.${ext}`);
            candidates.push(`${pref}${slug.toLowerCase()}.${ext}`);
            candidates.push(`${pref}${lower.replace(/\s+/g,'_')}.${ext}`);
        });
    });

    const uniq = [...new Set(candidates)];
    console.log(`Buscando imagen para "${name}" — ${uniq.length} candidatas (slug="${slug}")`);

    return new Promise(resolve => {
        let i = 0;
        function next(){
            if(i >= uniq.length){ console.warn(`NO encontrada imagen para "${name}"`); resolve(null); return; }
            const src = uniq[i++];
            const tester = new Image();
            tester.onload = () => { console.log(`-> encontrada para "${name}": ${src}`); resolve(src); };
            tester.onerror = () => { next(); };
            tester.src = src;
        }
        next();
    });
}

/* CARGA DINÁMICA + SORTEO */
let isSpinning = false, stopRequested = false, currentSleep = null;
function cancellableSleep(ms){
    let timer = null, resolveFn = null;
    const p = new Promise(resolve => { resolveFn = resolve; timer = setTimeout(resolve, ms); });
    p.cancel = () => { if(timer) clearTimeout(timer); if(resolveFn) resolveFn(); };
    return p;
}

async function cargarKillers(){
    galeria.innerHTML = ""; // limpia (panelFinal se añadirá al final)
    const layout = [5,6,7,8,7,6,5];

let posicion = 0;

for (const cantidad of layout) {

    let fila = document.createElement("div");
    fila.className = "fila";

    for(let i = 0; i < cantidad; i++){

        const idx = posicion++;
        const killer = participantes[idx];

        const card = document.createElement("div");
        card.className = "foto";

        card.dataset.indice = idx;
        card.title = killer.nombre;

        const img = document.createElement("img");
        img.alt = killer.nombre;
        img.src = fallbackDataURL(110); // placeholder mientras se busca la imagen real

        tryImageCandidatesVerbose(killer).then(src => {
            if(src){
                img.src = src;
            } else {
                img.src = fallbackDataURL(110);
                card.classList.add("desactivado");
                const notice = document.createElement("div");
                notice.className = "falta-badge";
                notice.textContent = `FALTA: ${killer.nombre}`;
                card.appendChild(notice);
            }
        });

card.appendChild(img);
const marco = document.createElement("img");
marco.src = "./Marco Killers.png";
marco.onerror = function(){ this.style.display = 'none'; };
marco.className = "marco-killer";
card.appendChild(marco);
card.addEventListener("click", () => {

    if (isSpinning) return;

    killer.activo = !killer.activo;
    card.classList.toggle("desactivado");

});

        fila.appendChild(card);
    }

    galeria.appendChild(fila);
}
    galeria.appendChild(panelFinal);
}

boton.addEventListener("click", () => {

    document.getElementById("winnerName").style.opacity = "0";

    if(!isSpinning) iniciarSorteo();
    else {
        stopRequested = true;
        if(currentSleep && currentSleep.cancel) currentSleep.cancel();
    }
});

async function iniciarSorteo(){

    iniciarAudio();

    const zoom = document.getElementById("winnerZoom");
   
    zoom.style.opacity = "0";
    zoom.classList.remove("zoom-activo");

    const cards = document.querySelectorAll(".foto");
    cards.forEach(card=>{ card.classList.remove("activa"); card.classList.remove("ganador"); });
    resultadoEl.textContent = "";

    const activos = participantes.map((p,i)=>({...p, indice:i})).filter(p=>p.activo);
    if(activos.length < 2){ alert("Debe haber al menos 2 participantes activos"); return; }

    isSpinning = true; stopRequested = false; setIconoBoton("stop"); boton.disabled = false;
    boton.classList.add("girando");
    progressRing.classList.add("visible");
    ringFg.style.strokeDashoffset = RING_C;
    const duracion = 17000,
      tiempoFrenado = 8000,

/* El botón GIRAR ahora se puede arrastrar libremente con el ratón/dedo.
   Su posición se guarda en localStorage para que se recuerde entre
   sesiones, y se le avisa a panel.html de su posición real (rect) para
   que, si la ventana está bloqueada con el candado, pueda seguir
   activándose con un clic a través de un "agujero" transparente. */
const diceWrap = document.getElementById("diceWrap");

(function habilitarArrastreDiceWrap(){
  const CLAVE_POS = 'killerGirarBtnPos';
  const UMBRAL = 4; // px de movimiento mínimo para considerarlo arrastre y no un clic
  let arrastrando = false;
  let seMovio = false;

  // Pasa de la posición fija por CSS (top/right) a top/left explícitos en
  // px, para poder moverlo libremente con JS a partir de ahora.
  function fijarPosicionInicial(){
    let guardada = null;
    try{ guardada = JSON.parse(localStorage.getItem(CLAVE_POS) || 'null'); }catch(e){}
    if(guardada && typeof guardada.left === 'number' && typeof guardada.top === 'number'){
      diceWrap.style.left = guardada.left + 'px';
      diceWrap.style.top = guardada.top + 'px';
      diceWrap.style.right = 'auto';
    } else {
      const r = diceWrap.getBoundingClientRect();
      diceWrap.style.left = r.left + 'px';
      diceWrap.style.top = r.top + 'px';
      diceWrap.style.right = 'auto';
    }
  }
  fijarPosicionInicial();

  function limitarACanvas(left, top){
    const anchoDoc = document.documentElement.clientWidth;
    const altoDoc = document.documentElement.clientHeight;
    const w = diceWrap.offsetWidth, h = diceWrap.offsetHeight;
    left = Math.max(0, Math.min(left, anchoDoc - w));
    top = Math.max(0, Math.min(top, altoDoc - h));
    return { left, top };
  }

  diceWrap.addEventListener('pointerdown', (e)=>{
    if(e.button !== undefined && e.button !== 0) return;
    arrastrando = true;
    seMovio = false;
    const startX = e.clientX, startY = e.clientY;
    const rect = diceWrap.getBoundingClientRect();
    const offX = startX - rect.left, offY = startY - rect.top;
    diceWrap.setPointerCapture(e.pointerId);

    function mover(ev){
      const dx = ev.clientX - startX, dy = ev.clientY - startY;
      if(!seMovio && (Math.abs(dx) > UMBRAL || Math.abs(dy) > UMBRAL)){
        seMovio = true;
        diceWrap.classList.add('arrastrando');
      }
      if(seMovio){
        const pos = limitarACanvas(ev.clientX - offX, ev.clientY - offY);
        diceWrap.style.left = pos.left + 'px';
        diceWrap.style.top = pos.top + 'px';
      }
    }
    function soltar(ev){
      arrastrando = false;
      diceWrap.classList.remove('arrastrando');
      diceWrap.removeEventListener('pointermove', mover);
      diceWrap.removeEventListener('pointerup', soltar);
      diceWrap.removeEventListener('pointercancel', soltar);
      if(seMovio){
        try{
          localStorage.setItem(CLAVE_POS, JSON.stringify({
            left: parseFloat(diceWrap.style.left),
            top: parseFloat(diceWrap.style.top)
          }));
        }catch(err){}
        reportarPosicionGirar();
      }
    }
    diceWrap.addEventListener('pointermove', mover);
    diceWrap.addEventListener('pointerup', soltar);
    diceWrap.addEventListener('pointercancel', soltar);
  });

  // Si hubo arrastre real, cancela el clic que el navegador dispararía
  // igualmente al soltar, para que no se confunda con "pulsar GIRAR".
  // Se intercepta en document (fase de captura), no en el propio botón:
  // un listener de captura puesto en el MISMO elemento que ya tiene otro
  // listener de clic no garantiza ejecutarse antes (el orden real es el
  // de registro, no el de la fase). Capturando en un ancestro sí se
  // garantiza que esto corre antes de que el clic llegue al botón.
  document.addEventListener('click', (e)=>{
    if(seMovio && (e.target === boton || boton.contains(e.target))){
      e.preventDefault();
      e.stopPropagation();
      seMovio = false;
    }
  }, true);

  window.reportarPosicionGirar = reportarPosicionGirar;
})();

/* Reporta a panel.html el rectángulo real (en pantalla) del botón GIRAR,
   para que —si esta ventana está bloqueada con el candado— pueda colocar
   encima un hueco clicable que reenvíe el clic aquí y el botón siga
   funcionando aunque el resto esté bloqueado. */
function reportarPosicionGirar(){
  const r = diceWrap.getBoundingClientRect();
  try{
    parent.postMessage({
      type:'liveButtonRectKiller',
      left:r.left, top:r.top, right:r.right, bottom:r.bottom
    }, '*');
  }catch(e){}
}
window.addEventListener('load', reportarPosicionGirar);
setTimeout(reportarPosicionGirar, 300);
setTimeout(reportarPosicionGirar, 1000);

/* Permite que panel.html, cuando esta ventana está bloqueada con el
   candado, reenvíe aquí el clic sobre el hueco proxy y el botón GIRAR
   siga funcionando con total normalidad. */
window.addEventListener('message', function(e){
  const d = e.data || {};
  if(d.type === 'clickGirar'){
    boton.click();
  }
});

</script>

/* --- Reporta al panel el tamaño real del contenido, para que pueda
   escalarlo (zoom) sin recortarlo al redimensionar la ventana --- */
(function(){
  // #diceWrap (el botón GIRAR) es position:fixed, así que NO forma parte
  // del cuadro de #galeria aunque esté anidado dentro de él en el HTML.
  // Si no se incluye aquí explícitamente, el rectángulo que se le reporta
  // a panel.html para calcular el zoom/encaje del iframe no contempla la
  // posición real del botón, y este se descuadra o se recorta al
  // reescalar la ventana (p. ej. al abrir el Panel de Control).
  var SELECTORES = ['#galeria', '#diceWrap'];
  var MARGEN = 12;
  var pendiente = false;
  function medir(){
    var left=Infinity, top=Infinity, right=-Infinity, bottom=-Infinity, hayAlgo=false;
    SELECTORES.forEach(function(sel){
      document.querySelectorAll(sel).forEach(function(el){
        var cs = getComputedStyle(el);
        if(cs.display === 'none' || cs.visibility === 'hidden') return;
        var r = el.getBoundingClientRect();
        if(r.width === 0 && r.height === 0) return;
        hayAlgo = true;
        if(r.left < left) left = r.left;
        if(r.top < top) top = r.top;
        if(r.right > right) right = r.right;
        if(r.bottom > bottom) bottom = r.bottom;
      });
    });
    if(!hayAlgo || right <= left || bottom <= top) return;
    try{
      parent.postMessage({
        type:'contentSize',
        left: Math.floor(left) - MARGEN,
        top: Math.floor(top) - MARGEN,
        right: Math.ceil(right) + MARGEN,
        bottom: Math.ceil(bottom) + MARGEN
      }, '*');
    }catch(e){}
  }
  function solicitarMedicion(){
    if(pendiente) return;
    pendiente = true;
    requestAnimationFrame(function(){ pendiente = false; medir(); });
  }
  window.addEventListener('load', medir);
  setTimeout(medir, 300);
  setTimeout(medir, 1000);
  setTimeout(medir, 2500);
  if(window.ResizeObserver){
    var ro = new ResizeObserver(solicitarMedicion);
    SELECTORES.forEach(function(sel){
      document.querySelectorAll(sel).forEach(function(el){ ro.observe(el); });
    });
  }
})();
</script>
